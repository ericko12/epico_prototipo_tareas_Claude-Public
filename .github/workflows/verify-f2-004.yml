name: Verify F2-004 prototype
on:
  push:
    branches: [feature/f2-004-diagnostico-radiografia]
  pull_request:
    paths:
      - "features/clientes/**"
      - ".github/workflows/verify-f2-004.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /epico_prototipo_tareas_Claude-Public
